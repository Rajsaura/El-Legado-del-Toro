    <path d="M 130 90 C 140 65 165 60 185 75 C 195 85 185 110 170 120 C 155 125 140 115 130 90 Z" />
    <path d="M 145 160 L 155 235 L 138 238 L 130 180 Z" />
    <path d="M 170 160 L 175 230 L 160 235 L 155 175 Z" />
    <path d="M 40 170 L 30 235 L 45 240 L 60 185 Z" />
    <path d="M 70 180 L 65 230 L 78 235 L 85 185 Z" />
    <path d="M 10 115 C -5 135 -10 170 5 205 C 10 215 5 220 0 220 C -5 215 -15 170 0 115 Z" />
