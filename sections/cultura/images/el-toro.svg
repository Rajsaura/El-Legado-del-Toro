      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="100%" stop-color="#EFE9DD" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#toroBg)" />
  
  <!-- Sol de fondo y siluetas campestres de la dehesa -->
  <circle cx="200" cy="130" r="75" fill="#E0B32D" opacity="0.25" />
  <!-- Encinas ibéricas al horizonte -->
  <path d="M 60 210 C 50 185 80 170 110 175 C 130 160 160 175 160 195 C 170 210 150 215 130 215 Z" fill="#7E746D" opacity="0.4" />
  <path d="M 250 210 C 240 185 270 170 300 175 C 320 160 350 175 350 195 C 360 210 340 215 320 215 Z" fill="#7E746D" opacity="0.4" />
  <!-- Suelo de pasto y albero -->
