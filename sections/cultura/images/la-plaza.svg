<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%" role="img" aria-label="La Plaza de Toros: arquitectura monumental neomudéjar">
  <defs>
    <linearGradient id="plazaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="100%" stop-color="#EFE9DD" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#plazaBg)" />
  
  <!-- Cielo y sol suave -->
  <circle cx="200" cy="110" r="70" fill="#E0B32D" opacity="0.2" />

  <!-- Estructura de arquería neomudéjar monumental -->
  <g fill="#5C1010" stroke="#8B1E1E" stroke-width="1">
    <!-- Basamento -->
    <rect x="40" y="210" width="320" height="35" rx="3" fill="#E2DACB" stroke="#7E746D" />
    <!-- Cornisa superior -->
    <rect x="40" y="70" width="320" height="20" rx="2" fill="#5C1010" />
    <rect x="50" y="90" width="300" height="10" fill="#C99700" />

    <!-- 5 Arcos de herradura neomudéjares -->
    <!-- Arco 1 -->
    <path d="M 60 210 L 60 140 C 60 115 100 115 100 140 L 100 210 Z" fill="#FCFAF6" stroke="#C99700" stroke-width="3" />
    <!-- Arco 2 -->
    <path d="M 120 210 L 120 140 C 120 115 160 115 160 140 L 160 210 Z" fill="#FCFAF6" stroke="#C99700" stroke-width="3" />
    <!-- Puerta grande central (Arco 3) -->
    <path d="M 175 210 L 175 130 C 175 100 225 100 225 130 L 225 210 Z" fill="#231F20" stroke="#E0B32D" stroke-width="4" />
    <!-- Arco 4 -->
    <path d="M 240 210 L 240 140 C 240 115 280 115 280 140 L 280 210 Z" fill="#FCFAF6" stroke="#C99700" stroke-width="3" />
    <!-- Arco 5 -->
    <path d="M 300 210 L 300 140 C 300 115 340 115 340 140 L 340 210 Z" fill="#FCFAF6" stroke="#C99700" stroke-width="3" />
  </g>

  <!-- Remates y azulejería tradicional en la cornisa -->
  <g fill="#C99700">
    <polygon points="60,70 65,55 70,70" />
    <polygon points="120,70 125,55 130,70" />
    <polygon points="200,65 200,45 205,45 205,65" />
    <polygon points="270,70 275,55 280,70" />
    <polygon points="330,70 335,55 340,70" />
  </g>

  <!-- Suelo de albero / arena -->
  <rect x="0" y="245" width="400" height="35" fill="#C99700" opacity="0.3" />
</svg>
