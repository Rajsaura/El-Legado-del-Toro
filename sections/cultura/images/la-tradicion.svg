<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%" role="img" aria-label="La Tradición y el Arte: guitarra española, notas de pasodoble y abanico">
  <defs>
    <linearGradient id="tradicionBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="100%" stop-color="#EFE9DD" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#tradicionBg)" />
  <circle cx="200" cy="140" r="90" fill="#8B1E1E" opacity="0.08" />

  <!-- Abanico desplegado de fondo -->
  <path d="M 120 180 Q 200 80 280 180 Z" fill="#EFE9DD" stroke="#C99700" stroke-width="2" />
  <g stroke="#C99700" stroke-width="1.2" opacity="0.6">
    <line x1="200" y1="180" x2="140" y2="115" />
    <line x1="200" y1="180" x2="165" y2="95" />
    <line x1="200" y1="180" x2="200" y2="85" />
    <line x1="200" y1="180" x2="235" y2="95" />
    <line x1="200" y1="180" x2="260" y2="115" />
  </g>

  <!-- Guitarra española clásica -->
  <g transform="translate(150, 60) rotate(15)">
    <!-- Cuerpo de la guitarra (ocho) -->
    <path d="M 30 70 C 10 70 0 85 0 100 C 0 115 15 125 15 135 C 15 145 -5 160 -5 180 C -5 205 20 220 50 220 C 80 220 105 205 105 180 C 105 160 85 145 85 135 C 85 125 100 115 100 100 C 100 85 90 70 70 70 Z" fill="#8B1E1E" stroke="#5C1010" stroke-width="2" />
    <!-- Boca de la guitarra y roseta dorada -->
    <circle cx="50" cy="115" r="16" fill="#231F20" />
    <circle cx="50" cy="115" r="18" fill="none" stroke="#C99700" stroke-width="2" />
    <!-- Mástil y clavijero -->
    <rect x="44" y="0" width="12" height="70" fill="#574F4A" />
    <rect x="40" y="-20" width="20" height="20" rx="3" fill="#231F20" />
    <!-- Cuerdas -->
    <line x1="47" y1="-10" x2="47" y2="180" stroke="#EFE9DD" stroke-width="1" />
    <line x1="50" y1="-10" x2="50" y2="180" stroke="#EFE9DD" stroke-width="1" />
    <line x1="53" y1="-10" x2="53" y2="180" stroke="#EFE9DD" stroke-width="1" />
  </g>

  <!-- Notas musicales doradas que flotan (evocando el pasodoble) -->
  <g fill="#C99700" opacity="0.85">
    <!-- Nota 1 -->
    <circle cx="85" cy="80" r="6" />
    <line x1="91" y1="80" x2="91" y2="55" stroke="#C99700" stroke-width="2" />
    <path d="M 91 55 Q 105 55 105 65" stroke="#C99700" stroke-width="2" fill="none" />
    <!-- Nota 2 doble -->
    <circle cx="310" cy="100" r="5" />
    <circle cx="330" cy="90" r="5" />
    <line x1="315" y1="100" x2="315" y2="70" stroke="#C99700" stroke-width="2" />
    <line x1="335" y1="90" x2="335" y2="60" stroke="#C99700" stroke-width="2" />
    <line x1="315" y1="70" x2="335" y2="60" stroke="#C99700" stroke-width="2.5" />
  </g>

  <!-- Flor tradicional (clavel rojo estilizado) -->
  <circle cx="100" cy="210" r="14" fill="#8B1E1E" />
  <circle cx="95" cy="205" r="10" fill="#B83232" />
  <circle cx="105" cy="215" r="8" fill="#5C1010" />
  <circle cx="100" cy="210" r="4" fill="#E0B32D" />
</svg>
