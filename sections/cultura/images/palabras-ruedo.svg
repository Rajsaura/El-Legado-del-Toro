<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" role="img" aria-label="Palabras del Ruedo: bocadillos de diálogo con modismos españoles y pluma tipográfica">
  <defs>
    <linearGradient id="palabrasBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="100%" stop-color="#EFE9DD" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#palabrasBg)" />
  
  <circle cx="200" cy="120" r="85" fill="#C99700" opacity="0.1" />

  <!-- Bocadillo de diálogo 1 (Principal - Granate) -->
  <g transform="translate(60, 40)">
    <path d="M 10 0 L 190 0 C 200 0 200 10 200 10 L 200 70 C 200 80 190 80 190 80 L 50 80 L 25 105 L 30 80 L 10 80 C 0 80 0 70 0 70 L 0 10 C 0 0 10 0 10 0 Z" fill="#5C1010" stroke="#8B1E1E" stroke-width="2" />
    <text x="100" y="35" font-family="'Cinzel', serif" font-size="10" fill="#FCFAF6" text-anchor="middle" font-weight="bold">«TOMAR EL TORO</text>
    <text x="100" y="55" font-family="'Cinzel', serif" font-size="10" fill="#E0B32D" text-anchor="middle" font-weight="bold">POR LOS CUERNOS»</text>
  </g>

  <!-- Bocadillo de diálogo 2 (Secundario - Marfil y Dorado) -->
  <g transform="translate(160, 115)">
    <path d="M 10 0 L 180 0 C 190 0 190 10 190 10 L 190 65 C 190 75 180 75 180 75 L 140 75 L 145 95 L 120 75 L 10 75 C 0 75 0 65 0 65 L 0 10 C 0 0 10 0 10 0 Z" fill="#FCFAF6" stroke="#C99700" stroke-width="2" />
    <text x="95" y="32" font-family="'Playfair Display', serif" font-size="9" fill="#231F20" text-anchor="middle" font-style="italic">«Ver los toros</text>
    <text x="95" y="50" font-family="'Playfair Display', serif" font-size="9" fill="#5C1010" text-anchor="middle" font-style="italic">desde la barrera»</text>
  </g>

  <!-- Comillas tipográficas ornamentales en oro -->
  <text x="45" y="60" font-family="'Playfair Display', serif" font-size="40" fill="#C99700" opacity="0.4">“</text>
  <text x="365" y="190" font-family="'Playfair Display', serif" font-size="40" fill="#C99700" opacity="0.4">”</text>

  <!-- Pluma estilográfica decorativa -->
  <g transform="translate(70, 160) rotate(-25)">
    <rect x="0" y="0" width="8" height="50" rx="3" fill="#8B1E1E" />
    <polygon points="4,50 8,62 4,68 0,62" fill="#C99700" />
    <line x1="4" y1="50" x2="4" y2="65" stroke="#231F20" stroke-width="1" />
  </g>
</svg>
